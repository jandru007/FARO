[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/scanner/Dockerfile"
watchPatterns = [
  "apps/scanner/**",
  "packages/shared/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "tsconfig.base.json"
]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
